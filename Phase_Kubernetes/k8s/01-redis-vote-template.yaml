# Optional advanced project lab: requires the PUBLIC Phase 04 frontend image.
# Replace __VOTE_IMAGE__ via scripts/06-vote.sh, not manually.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cg360-redis
  namespace: cg360
spec:
  replicas: 1
  selector:
    matchLabels: {app: cg360-redis}
  template:
    metadata:
      labels: {app: cg360-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
          volumeMounts:
            - name: ephemeral
              mountPath: /data
      volumes:
        - name: ephemeral
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cg360-redis
  namespace: cg360
spec:
  type: ClusterIP
  selector: {app: cg360-redis}
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cg360-vote
  namespace: cg360
spec:
  replicas: 1
  selector:
    matchLabels: {app: cg360-vote}
  template:
    metadata:
      labels: {app: cg360-vote}
    spec:
      containers:
        - name: vote
          image: __VOTE_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REDIS
              value: cg360-redis
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 35
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cg360-vote
  namespace: cg360
spec:
  type: ClusterIP
  selector: {app: cg360-vote}
  ports:
    - port: 80
      targetPort: 80
