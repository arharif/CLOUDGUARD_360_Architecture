apiVersion: v1
kind: Namespace
metadata:
  name: cg360
  labels:
    app.kubernetes.io/part-of: cloudguard360
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cg360-web
  namespace: cg360
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: cg360-web
  template:
    metadata:
      labels:
        app: cg360-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 160Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
---
apiVersion: v1
kind: Service
metadata:
  name: cg360-web
  namespace: cg360
spec:
  type: ClusterIP
  selector:
    app: cg360-web
  ports:
    - port: 80
      targetPort: 80
